<svg width="100%" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Disciplin logo system</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A refined vector version of the Disciplin logo: a "D" monogram fused with a double forward chevron in purple gradient, shown as a full lockup with wordmark and tagline, plus navbar, favicon, app icon, and animated loading variants.</desc>
<defs>
  <linearGradient id="gradDeep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#3B0F70"/>
  </linearGradient>
  <linearGradient id="gradLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#DDD6FE"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <symbol id="mark" viewBox="0 0 200 200">
    <polygon points="30,35 100,100 30,165 58,165 128,100 58,35" fill="url(#gradDeep)"/>
    <polygon points="78,50 138,100 78,150 100,150 160,100 100,50" fill="url(#gradLight)"/>
    <path d="M100,30 C145,30 178,60 178,100 C178,140 145,170 100,170" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round"/>
  </symbol>
  <symbol id="mark-simple" viewBox="0 0 200 200">
    <polygon points="25,28 108,100 25,172 62,172 145,100 62,28" fill="url(#gradDeep)"/>
    <polygon points="88,44 158,100 88,156 118,156 188,100 118,44" fill="url(#gradLight)"/>
  </symbol>
</defs>

<rect x="40" y="30" width="600" height="230" rx="24" fill="#0A0A0F" style="fill:rgb(10, 10, 15);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<use href="#mark" x="70" y="55" width="150" height="150" color="#FFFFFF" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="250" y="150" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:60px;font-weight:800;text-anchor:start;dominant-baseline:auto">Disciplin</text>
<text x="252" y="182" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9A9AA5" style="fill:rgb(154, 154, 165);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:15px;font-weight:400;text-anchor:start;dominant-baseline:auto">
  <tspan style="fill:rgb(154, 154, 165);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:15px;font-weight:400;text-anchor:start;dominant-baseline:auto">focus. consistency. </tspan><tspan fill="#B39DFB" style="fill:rgb(179, 157, 251);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:15px;font-weight:400;text-anchor:start;dominant-baseline:auto">growth.</tspan>
</text>
