<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Disciplin</title>
<desc>Disciplin logo (light mode variant): a "D" monogram fused with a double forward chevron in purple gradient, with dark wordmark and centered tagline.</desc>
<defs>
  <linearGradient id="gradDeep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#3B0F70"/>
  </linearGradient>
  <linearGradient id="gradLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#DDD6FE"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <symbol id="mark" viewBox="0 0 200 200">
    <polygon points="30,35 100,100 30,165 58,165 128,100 58,35" fill="url(#gradDeep)"/>
    <polygon points="78,50 138,100 78,150 100,150 160,100 100,50" fill="url(#gradLight)"/>
    <path d="M100,30 C145,30 178,60 178,100 C178,140 145,170 100,170" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round"/>
  </symbol>
</defs>

<use href="#mark" x="20" y="15" width="150" height="150" color="#0F172A"/>
<text x="200" y="105" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900" letter-spacing="-1.5" fill="#0F172A">Disciplin</text>
<text x="330" y="142" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#475569">
  <tspan fill="#475569">focus. consistency. </tspan><tspan fill="#7C3AED">growth.</tspan>
</text>
<rect x="240" y="153" width="180" height="4" rx="2" fill="url(#gradLight)"/>
</svg>
