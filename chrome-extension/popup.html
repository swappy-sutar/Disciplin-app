<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Disciplin Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(26, 29, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #10B981;
      --accent-hover: #34d399;
      --accent-glow: rgba(16, 185, 129, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      width: 320px;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-hidden: hidden;
      padding: 16px;
      position: relative;
    }

    /* Background glow decorations */
    .glow-bg {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(16, 185, 129, 0) 70%);
      filter: blur(20px);
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header block */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
        box-shadow: 0 0 12px var(--accent);
      }
      100% {
        transform: scale(0.9);
        opacity: 0.6;
      }
    }

    /* Core Action Button */
    .primary-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, #059669 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .primary-btn:hover {
      background: linear-gradient(135deg, var(--accent-hover) 0%, var(--accent) 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    /* Dashboard grids */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .nav-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      text-decoration: none;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-card:hover {
      background: rgba(26, 29, 39, 0.9);
      border-color: rgba(16, 185, 129, 0.3);
      transform: translateY(-1px);
    }

    .card-icon {
      color: var(--accent);
      background: rgba(16, 185, 129, 0.1);
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
      transition: all 0.2s ease;
    }

    .nav-card:hover .card-icon {
      background: var(--accent);
      color: #ffffff;
      transform: scale(1.05);
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
    }

    .card-subtitle {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Shortcut suggestions section */
    .shortcuts-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
    }

    .shortcuts-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shortcut-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      font-size: 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .shortcut-item:last-child {
      border-bottom: none;
    }

    .shortcut-name {
      color: var(--text-main);
      font-weight: 500;
    }

    .shortcut-key {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 600;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .author-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .author-link:hover {
      color: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="container">
    
    <!-- Top Brand Bar -->
    <header class="header">
      <div class="brand-container">
        <img src="icon-32.png" alt="Disciplin Logo" class="logo-img" />
        <span class="brand-name">Disciplin</span>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Active</span>
      </div>
    </header>

    <!-- Main Entry Button -->
    <a href="http://localhost:5173/overview" class="primary-btn app-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      Open Cockpit Dashboard
    </a>

    <!-- Dashboard Quick Grid -->
    <div class="nav-grid">
      
      <a href="http://localhost:5173/habits" class="nav-card app-link">
        <span class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
        </span>
        <span class="card-title">Habits</span>
        <span class="card-subtitle">Streaks & triggers</span>
      </a>

      <a href="http://localhost:5173/goals" class="nav-card app-link">
        <span class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </span>
        <span class="card-title">Goals</span>
        <span class="card-subtitle">Weekly targets</span>
      </a>

      <a href="http://localhost:5173/workout" class="nav-card app-link">
        <span class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
        </span>
        <span class="card-title">Workout</span>
        <span class="card-subtitle">Routines & logs</span>
      </a>

      <a href="http://localhost:5173/applications" class="nav-card app-link">
        <span class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 12h8"/><path d="M8 16h6"/></svg>
        </span>
        <span class="card-title">Careers</span>
        <span class="card-subtitle">Job tracker</span>
      </a>

    </div>

    <!-- Shortcut tips -->
    <div class="shortcuts-section">
      <div class="shortcuts-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
        Dashboard Hotkeys
      </div>
      <div class="shortcut-item">
        <span class="shortcut-name">Toggle Sidebar</span>
        <span class="shortcut-key">Alt + B</span>
      </div>
      <div class="shortcut-item">
        <span class="shortcut-name">Create Habit</span>
        <span class="shortcut-key">Alt + H</span>
      </div>
      <div class="shortcut-item">
        <span class="shortcut-name">Change Theme</span>
        <span class="shortcut-key">Alt + T</span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div>Disciplin Companion v1.0.0</div>
      <div>Designed by <a href="https://github.com/swappy-sutar" class="author-link app-link">Er. Swappy</a></div>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
